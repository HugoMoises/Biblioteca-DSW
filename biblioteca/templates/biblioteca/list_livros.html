
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Livros</title>
</head>
<body>

    <h1>Biblioteca</h1>

    <a href="{% url 'livro-criar' %}">Novo livro</a>

    <ul>
        {% for livro in livros %}
            <li>
                {{ livro.titulo }} - 
                
                {% for autor in livro.autor.all %}
                    <a href="{% url 'autor' autor.id %}">{{ autor }}</a>
                {% endfor %}
                - {{ livro.ano_publicacao }}

                <a href="{% url 'livro-editar' livro.id %}?next={{ request.get_full_path|urlencode }}">Editar</a>
            </li>
        {% empty %}
            <li>Nenhum livro cadastrado.</li>
        {% endfor %}
    </ul>

    <a href="{% url 'create-autor' %}">Novo autor</a>

</body>
</html>
