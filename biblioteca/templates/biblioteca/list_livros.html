<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul>
        {% for livro in livros %}
            <li>{{livro.titulo}} - <a href="{% url 'autor' livro.autor.id %}">{{livro.autor}}</a> - {{livro.ano_publicacao}}</li>
        {% empty %}
            <li>Nenhum Livro Cadastrado</li>
        {% endfor %}
    </ul>
</body>
</html>
