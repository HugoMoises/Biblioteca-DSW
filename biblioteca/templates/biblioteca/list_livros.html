
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Livros</title>
</head>
<body>

    <h1>Biblioteca</h1>

    <a href="{% url 'livro-novo' %}">Novo livro</a>

    <ul>
        {% for livro in livros %}
            <li>
                {{ livro.titulo }} - <a href="{% url 'autor' livro.autor.id %}">{{ livro.autor }}</a>

                - {{ livro.ano_publicacao }}

                <a href="{% url 'livro-editar' livro.id %}">Editar</a>
            </li>
        {% empty %}
            <li>Nenhum livro cadastrado.</li>
        {% endfor %}
    </ul>

    <a href="{% url 'create-autor' %}">Novo autor</a>

</body>
</html>
