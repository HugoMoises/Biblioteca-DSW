<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>{{autor.name}}</h1>
    <h2>Livros do autor {{autor.name}}</h2>
    <ul>
        {% for livro in livros %}
            <li>{{livro.titulo}}</li>
        {% empty %}
            <li>Este autor não tem nenhum livro cadastrado</li>
        {% endfor %}
    </ul>
</body>
</html>
