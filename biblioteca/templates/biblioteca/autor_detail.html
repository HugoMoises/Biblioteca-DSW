<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>{{autor.name}}</h1>
    <h2>Livros do autor {{autor.name}}</h2>
    <ul>
        {% for livro in livros %}
            <li>{{livro.titulo}} - {{livro.ano_publicacao}}</li>
            <a href="{% url 'livro-editar' livro.id %}?next={{ request.get_full_path|urlencode }}">Editar</a>
            <a href="{% url 'livro-excluir' livro.id %}?next={{ request.get_full_path|urlencode }}">Excluir</a>
        {% empty %}
            <li>Este autor não tem nenhum livro cadastrado</li>
        {% endfor %}
    </ul>
    <a href="{% url 'livros' %}">Ver livros</a>
</body>
</html>
